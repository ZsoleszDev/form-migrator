name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-*.txt
      # The generated Java is compiled against the offline stubs (tests/java_support.py).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The generated screens: tsc --strict, and their button flows run in Node (--experimental-strip-types).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          python -m pip install -r requirements-test.txt
          npm install -g typescript@6.0.2
      - name: Unit tests
        env:
          PYTHONPATH: .:tests
        run: python -m unittest discover -s tests -v
