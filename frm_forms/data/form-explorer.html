<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Forms modultérkép</title><style>
:root{font:15px/1.55 system-ui,sans-serif;color:#172c35;background:#f1f5f5;--ink:#133842;--mint:#c4efe0;--line:#dce4e6}*{box-sizing:border-box}body{margin:0}header{background:var(--ink);color:white;padding:26px 34px}header small{color:var(--mint);font-weight:650;letter-spacing:.14em}h1{font-size:29px;margin:8px 0}h2{margin:0 0 12px;font-size:21px}h3{font-size:16px}header p{color:#cfdddd;margin:0;max-width:960px}.stats{display:flex;gap:26px;padding:16px 34px;background:white;border-bottom:1px solid var(--line);flex-wrap:wrap}.stats strong{font-size:25px;margin-right:6px}.toolbar{padding:16px 24px;display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;border:1px solid #c8d7db;background:white;padding:9px 12px;border-radius:7px}input{min-width:260px;flex:1}button{cursor:pointer;color:var(--ink)}button:hover,button.active{background:var(--mint)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #428576}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;padding:0 24px 26px}aside{background:white;border:1px solid var(--line);border-radius:10px;max-height:78vh;overflow:auto}aside button{display:block;text-align:left;width:100%;border:0;border-radius:0;border-bottom:1px solid #edf0f1;overflow-wrap:anywhere}aside small{display:block;color:#647c83}main{background:white;border:1px solid var(--line);border-radius:10px;padding:24px;min-width:0;overflow:auto}.note{border-left:3px solid #bc8c42;background:#fffaeb;padding:12px 15px;margin:12px 0;color:#65502d}pre{background:#102b34;color:#d9eee5;border-radius:8px;padding:18px;overflow:auto;tab-size:2;white-space:pre-wrap;word-break:break-word;font:13px/1.6 ui-monospace,Consolas,monospace;max-height:620px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}th{color:#587078}td pre{margin:0}.muted{color:#657e85}.links{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.canvas{position:relative;min-width:750px;background:linear-gradient(#dae5e566 1px,transparent 1px),linear-gradient(90deg,#dae5e566 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);margin:16px 0}.field{position:absolute;border:1px solid #8cb1b3;background:#f6fcfa;font-size:11px;padding:2px;overflow:hidden;border-radius:2px;min-height:20px}.field:hover{z-index:2;background:#c4efe0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.card{border:1px solid var(--line);padding:16px;border-radius:8px;overflow-wrap:anywhere;margin-bottom:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{max-height:230px}header{padding:22px}.stats{padding:12px 22px}.layout{padding:0 12px}main{padding:16px}}
</style></head><body>
<header><small>FRM · FORMS FELTÉRKÉPEZÉS</small><h1 id="title">Modultérkép</h1><p>Objektumok, események és forráskód egy helyen. Helyben megnyitható; nincs hálózati kérés vagy kódfuttatás.</p></header>
<div id="stats" class="stats"></div><div class="toolbar"><input id="search" type="search" placeholder="Objektum, mező, eljárás vagy forrásszöveg keresése…" aria-label="Keresés"><select id="kind" aria-label="Objektumtípus"><option value="">Minden objektum</option></select><button id="overview">Áttekintés</button><button id="actions">Gombesemények</button><button id="screens">Képernyőváz</button><button id="dependencies">Függőségek</button></div>
<div class="layout"><aside id="objects" aria-label="Objektumlista"></aside><main id="detail" aria-live="polite"></main></div>
<script id="data" type="application/json">__FORM_MAP_JSON__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),byId=new Map(data.objects.map(o=>[o.id,o])),codeById=new Map(data.code.map(c=>[c.id,c]));
const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e;};
const detail=document.getElementById('detail');
function start(title){detail.replaceChildren(el('h2',title));detail.scrollTop=0;}
function note(t){detail.append(el('p',t,'note'));}
function objectLabel(o){return (o?.name||o?.kind||'')+(o?.kind==='programunit'&&o.properties.programunittype?' · '+o.properties.programunittype:'');}
function link(id,label){const o=byId.get(id),b=el('button',label||objectLabel(o)||id);b.onclick=()=>show(id);return b;}
function links(ids){const box=el('div',undefined,'links');ids.forEach(id=>box.append(link(id)));return box;}
function table(headers,rows){const t=el('table'),head=el('tr');headers.forEach(h=>head.append(el('th',h)));t.append(head);for(const row of rows){const r=el('tr');row.forEach(v=>{const c=el('td');c.append(v instanceof Node?v:el('span',v??''));r.append(c);});t.append(r);}return t;}
function source(code){detail.append(el('h3','Forráskód · '+code.kind),el('p','SHA-256: '+code.sha256,'muted'));if(code.warnings.length)note(code.warnings.join(' · '));detail.append(el('pre',code.source_view));if(code.analysis_view_decoded){const d=el('details');d.append(el('summary','Eredeti forrásszöveg'),el('pre',code.source));detail.append(d);}if(code.calls.length)detail.append(el('h3','Hívásjelöltek — forrásbeli hely, nem futási sorrend'),table(['Sor','Hívás','Besorolás','Argumentumok / helyi cél'],code.calls.map(c=>{const box=el('div');box.append(el('pre',c.arguments.join('\n')||'(nincs argumentum)'));if(c.target_ids.length)box.append(links(c.target_ids));if(c.event_target_candidates?.length)box.append(el('p','Lehetséges eseménycélok; hierarchia/fókusz ellenőrzendő'),links(c.event_target_candidates));return[c.line,c.name,c.kind,box];})));if(code.binds.length)detail.append(el('h3','Forms állapot és bindek'),table(['Sor','Név','Használat'],code.binds.map(b=>[b.line,':'+b.name,b.usage])));if(code.sql.length){detail.append(el('h3','SQL-részletek'));code.sql.forEach(s=>detail.append(el('p',s.kind+' · '+s.line+'. sor'),el('pre',s.text)));}}
function show(id){const o=byId.get(id);if(!o)return;start(objectLabel(o));detail.append(el('p',o.file+' · '+o.path,'muted'));if(o.parent_id)detail.append(link(o.parent_id,'↑ Szülőobjektum'));const children=data.objects.filter(c=>c.parent_id===id);if(children.length)detail.append(el('h3','Gyerekobjektumok'),links(children.map(c=>c.id)));const code=codeById.get(id);if(code)source(code);const p=el('details');p.open=!code;p.append(el('summary','Összes XML-property ('+Object.keys(o.properties).length+')'),table(['Property','Érték'],Object.entries(o.properties)));detail.append(p);}
function overview(){start('A modul kézi feltérképezésének kiindulópontja');data.warnings.forEach(note);const cards=el('div',undefined,'cards');for(const[k,label]of[['block','Blokkok'],['programunit','Helyi programegységek'],['recordgroup','Rekordcsoportok / SQL'],['lov','Értékválasztók']]){const c=el('div',undefined,'card');c.append(el('h3',label),links(data.objects.filter(o=>o.kind===k).map(o=>o.id)));cards.append(c);}detail.append(cards);note('Az FMB helyi programegységei a Forms runtime részei. JDBC-híváshoz adatbázisban létező eljárás vagy kézzel készített Java/DB adapter szükséges.');}
function actions(){start('Mit csinál a gombesemény?');note('Statikus hivatkozások. Feltételek, eseményhierarchia, külső kód és futásidejű állapot módosíthatják a működést.');for(const a of data.actions){const c=el('section',undefined,'card');c.append(el('h3',a.owner+' · '+a.event),links(a.reachable_code),el('p','Bindek: '+(a.binds.join(', ')||'nincs felismert bind')),el('p','Külső/ismeretlen hívások: '+(a.external_calls.join(', ')||'nincs felismert hívás')));detail.append(c);}if(!data.actions.length)detail.append(el('p','Nincs WHEN-BUTTON-PRESSED trigger.'));}
function screens(){start('Képernyőváz a forráskoordináták arányaival');note('Elemzési előnézet, nem pixelpontos Oracle-renderelés. Fontok, promptpozíciók, ismétlődő rekordok és futásidejű láthatóság nincsenek emulálva.');for(const canvas of data.objects.filter(o=>o.kind==='canvas')){detail.append(el('h3',canvas.name));const items=data.objects.filter(o=>o.file===canvas.file&&o.kind==='item'&&o.properties.canvasname===canvas.name),valid=items.filter(o=>['xposition','yposition','width','height'].every(k=>o.properties[k]!==undefined&&o.properties[k]!==''&&Number.isFinite(Number(o.properties[k])))&&+o.properties.width>0&&+o.properties.height>0);if(!valid.length){detail.append(el('p','Nincs elegendő geometria.'),links(items.map(o=>o.id)));continue;}const minX=Math.min(0,...valid.map(o=>+o.properties.xposition)),minY=Math.min(0,...valid.map(o=>+o.properties.yposition)),maxX=Math.max(...valid.map(o=>+o.properties.xposition + +o.properties.width)),maxY=Math.max(...valid.map(o=>+o.properties.yposition + +o.properties.height)),extentX=Math.max(1,maxX-minX),extentY=Math.max(1,maxY-minY),height=Math.min(1200,Math.max(220,extentY/extentX*1000)),box=el('div',undefined,'canvas');box.style.height=height+'px';valid.forEach(o=>{const p=o.properties,b=link(o.id,p.prompt||p.label||o.name);b.className='field';b.title=o.block+'.'+o.name+' · '+(p.itemtype||'ismeretlen típus');b.style.left=((+p.xposition-minX)/extentX*100)+'%';b.style.top=((+p.yposition-minY)/extentY*height)+'px';b.style.width=Math.max(.5,+p.width/extentX*100)+'%';b.style.height=Math.max(20,+p.height/extentY*height)+'px';box.append(b);});detail.append(box);const missing=items.filter(o=>!valid.includes(o));if(missing.length)detail.append(el('p','Geometria nélkül:'),links(missing.map(o=>o.id)));}}
function dependencies(){start('Öröklés és külső könyvtárak');note('Ez hivatkozásleltár. A generált inheritance.json jelzi a feloldhatóságot. A hivatkozás nem tartalmazza a külső forrást.');detail.append(table(['Típus','Fájl / modul','Név','Forrásobjektum'],data.dependencies.map(d=>[d.kind,d.file||d.module||'nincs megadva',d.name,link(d.object_id,byId.get(d.object_id).name||d.object_id)])));}
const search=document.getElementById('search'),kind=document.getElementById('kind'),searchText=new Map(data.objects.map(o=>[o.id,(o.path+' '+JSON.stringify(o.properties)+' '+(codeById.get(o.id)?.source_view||'')).toLocaleLowerCase('hu')]));
function filter(){const q=search.value.toLocaleLowerCase('hu'),list=document.getElementById('objects');list.replaceChildren();const found=data.objects.filter(o=>(!kind.value||o.kind===kind.value)&&(!q||searchText.get(o.id).includes(q)));list.append(el('p',found.length+' objektum','muted'));found.forEach(o=>{const b=link(o.id,objectLabel(o));b.append(el('small',o.kind+(o.block&&o.kind!=='block'?' · '+o.block:'')));list.append(b);});}
Object.keys(data.counts).forEach(k=>{const o=el('option',k+' ('+data.counts[k]+')');o.value=k;kind.append(o);});for(const[k,label]of[['block','blokk'],['item','item'],['trigger','trigger'],['programunit','helyi programegység']]){const s=el('div');s.append(el('strong',data.counts[k]||0),el('span',label));document.getElementById('stats').append(s);}document.getElementById('title').textContent=data.objects.find(o=>o.kind==='formmodule')?.name||'Forms modultérkép';search.oninput=filter;kind.onchange=filter;document.getElementById('overview').onclick=overview;document.getElementById('actions').onclick=actions;document.getElementById('screens').onclick=screens;document.getElementById('dependencies').onclick=dependencies;filter();overview();
</script></body></html>
